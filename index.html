<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Deberes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f1f4f9">
<link rel="apple-touch-icon" href="icon.png">
<title>Mi semana y deberes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f1f4f9;--card:#fff;--ink:#14213d;--mute:#5f6b85;--line:#dde3ee;--acc:#2f5bea;--bad:#d6336c;--ok:#1f9d6b;--sp:46%;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1524;--card:#18203a;--ink:#e8edf9;--mute:#9aa6c4;--line:#2a3558;--acc:#7b9bff;--bad:#ff6b9a;--ok:#4fd1a0}}
:root[data-theme="dark"]{--bg:#0f1524;--card:#18203a;--ink:#e8edf9;--mute:#9aa6c4;--line:#2a3558;--acc:#7b9bff;--bad:#ff6b9a;--ok:#4fd1a0}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Outfit,system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:26px;margin:4px 0 14px;font-weight:700;letter-spacing:-.02em}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;color:var(--mute);font:600 15px Outfit,system-ui,sans-serif;padding:10px;border-radius:9px}
.seg button.on{background:var(--acc);color:#fff}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:14px}
.day{position:relative;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:10px 0 8px;font:600 13px Outfit,system-ui,sans-serif}
.day b{display:block;font-size:22px;font-weight:700;line-height:1.1}
.day.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.day i{position:absolute;top:6px;right:8px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font:600 11px/18px Outfit,sans-serif;font-style:normal;text-align:center;padding:0 4px}
.cls{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);border-left:6px solid var(--c);background:var(--card);color:var(--ink);border-radius:12px;padding:13px 14px;margin-bottom:9px;font-family:inherit}
.cls .t{flex:1}.cls strong{display:block;font-size:16px;font-weight:600}
.cls small{color:var(--mute);font-size:13px}
.badge{background:var(--c);color:#fff;border-radius:10px;font-size:12px;font-weight:600;padding:3px 9px}
.badge.z{background:none;color:var(--mute);border:1px solid var(--line)}
.task{display:flex;align-items:flex-start;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.task input{width:22px;height:22px;margin-top:1px;accent-color:var(--ok);flex:none}
.task .t{flex:1;min-width:0}.task p{margin:0;font-size:15px;overflow-wrap:anywhere}
.task.done p{text-decoration:line-through;color:var(--mute)}
.meta{font-size:12px;color:var(--mute);margin-top:3px}
.meta .chip{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:5px}
.late{color:var(--bad);font-weight:600}.soon{color:var(--acc);font-weight:600}
.x{border:0;background:none;color:var(--mute);font-size:20px;padding:0 4px}
.empty{color:var(--mute);text-align:center;padding:28px 10px;font-size:15px}
#ov{position:fixed;inset:0;background:rgba(10,15,30,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}
#ov.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:88%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px));border-top:6px solid var(--c)}
.sheet h2{margin:0 0 2px;font-size:22px}.sheet .sub{color:var(--mute);font-size:14px;margin-bottom:14px}
form{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:14px}
form input[type=text]{grid-column:1/3}
form input,form button{font:16px Outfit,system-ui,sans-serif;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-width:0}
form button{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
.close{float:right;border:0;background:var(--card);color:var(--ink);border-radius:50%;width:34px;height:34px;font-size:18px}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
h3{font-size:14px;color:var(--mute);margin:16px 0 8px;font-weight:600}
</style>
</head>
<body>
<main>
<h1>Mi semana</h1>
<div class="seg"><button id="bH" class="on">Horario</button><button id="bP">Pendientes</button></div>
<section id="vH"><div class="days" id="days"></div><div id="list"></div></section>
<section id="vP" hidden></section>
</main>
<div id="ov"><div class="sheet" id="sheet"></div></div>
<script>
var DIAS=[["Lunes","L"],["Martes","M"],["Miércoles","X"],["Jueves","J"],["Viernes","V"]];
var H=[
[["Tutoría","07:00 – 08:00"],["Química","08:00 – 09:20"],["Lengua Extranjera","09:20 – 10:00"],["Lengua y Literatura","10:00 – 10:45 y 11:30 – 12:10"],["Física","12:10 – 13:40"]],
[["Tutoría","07:00 – 07:20"],["Educación Religiosa","07:20 – 08:00"],["Matemática","08:00 – 09:20"],["Biología","09:20 – 10:00"],["Educación para la Ciudadanía","10:00 – 10:45 y 11:30 – 12:10"],["Lengua Extranjera","12:10 – 13:40"]],
[["Tutoría","07:00 – 07:20"],["Biología","07:20 – 08:40"],["Matemática","08:40 – 10:00"],["H.C.","10:00 – 10:45 y 11:30 – 12:10"],["Lengua Extranjera","12:10 – 12:50"],["Lengua y Literatura","12:50 – 13:40"]],
[["Tutoría","07:00 – 07:20"],["Skills","07:20 – 08:40"],["Educación Física","08:40 – 09:20"],["Matemática","09:20 – 10:00"],["Educación Religiosa","10:00 – 10:45"],["Lengua Extranjera","11:30 – 12:10"],["Lengua y Literatura","12:10 – 13:40"]],
[["Tutoría","07:00 – 07:20"],["Educación Física","07:20 – 08:00"],["Lengua Extranjera","08:00 – 08:40"],["Química","08:40 – 09:20"],["Robótica y Prog.","09:20 – 10:00"],["Pensamiento y MLO.","10:00 – 10:45 y 11:30 – 12:10"],["Filo","12:10 – 13:40"]]];
var SUBJ=[];H.forEach(function(d){d.forEach(function(c){if(SUBJ.indexOf(c[0])<0)SUBJ.push(c[0])})});
function col(s){return "hsl("+Math.round(SUBJ.indexOf(s)*360/SUBJ.length+12)+" 62% 46%)"}
var tasks=[];try{tasks=JSON.parse(localStorage.getItem("deberes")||"[]")}catch(e){tasks=[]}
function save(){try{localStorage.setItem("deberes",JSON.stringify(tasks))}catch(e){}}
var g=new Date().getDay(),day=(g>=1&&g<=5)?g-1:0,view="H",open=null;
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function pend(s){return tasks.filter(function(t){return !t.done&&(!s||t.s===s)})}
function today(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function diff(due){var p=due.split("-");return Math.round((new Date(+p[0],+p[1]-1,+p[2])-today())/864e5)}
function dueTxt(due){if(!due)return "";var n=diff(due),p=due.split("-");
if(n<0)return '<span class="late">Vencida ('+p[2]+"/"+p[1]+")</span>";
if(n===0)return '<span class="late">Para hoy</span>';
if(n===1)return '<span class="soon">Para mañana</span>';
return "Para el "+p[2]+"/"+p[1]}
function sortT(a,b){return (a.due||"9999").localeCompare(b.due||"9999")}
function taskHTML(t,showSubj){return '<div class="task'+(t.done?" done":"")+'" style="--c:'+col(t.s)+'"><input type="checkbox" data-id="'+t.id+'" aria-label="Hecha"'+(t.done?" checked":"")+'><div class="t"><p>'+esc(t.x)+'</p><div class="meta">'+(showSubj?'<span class="chip"></span>'+esc(t.s)+(t.due?" · ":""):"")+dueTxt(t.due)+'</div></div><button class="x" data-del="'+t.id+'" aria-label="Borrar">×</button></div>'}
function render(){
$("vH").hidden=view!=="H";$("vP").hidden=view!=="P";
$("bH").className=view==="H"?"on":"";$("bP").className=view==="P"?"on":"";
if(view==="H"){
$("days").innerHTML=DIAS.map(function(d,i){var n=H[i].reduce(function(a,c){return a+pend(c[0]).length},0);
return '<button class="day'+(i===day?" on":"")+'" data-d="'+i+'" aria-label="'+d[0]+'">'+(n?"<i>"+n+"</i>":"")+"<b>"+d[1]+"</b>"+d[0].slice(0,3)+"</button>"}).join("");
$("list").innerHTML=H[day].map(function(c){var n=pend(c[0]).length;
return '<button class="cls" style="--c:'+col(c[0])+'" data-s="'+esc(c[0])+'"><span class="t"><strong>'+esc(c[0])+"</strong><small>"+c[1]+'</small></span><span class="badge'+(n?"":" z")+'">'+(n?n+(n===1?" deber":" deberes"):"Al día")+"</span></button>"}).join("")}
else{var p=pend().sort(sortT);
$("vP").innerHTML=p.length?p.map(function(t){return taskHTML(t,true)}).join(""):'<div class="empty">No tienes deberes pendientes. Toca una clase en Horario para anotar uno.</div>'}
if(open)sheet()}
function sheet(){var s=open,p=tasks.filter(function(t){return t.s===s&&!t.done}).sort(sortT),d=tasks.filter(function(t){return t.s===s&&t.done});
var sh=$("sheet");sh.style.setProperty("--c",col(s));
sh.innerHTML='<button class="close" id="cl" aria-label="Cerrar">×</button><h2>'+esc(s)+'</h2><div class="sub">'+(p.length?p.length+" pendiente"+(p.length>1?"s":""):"Sin deberes pendientes")+'</div><form id="f"><input type="text" id="tx" placeholder="Qué hay que hacer (ej. ejercicios pág. 45)" required maxlength="200"><input type="date" id="du" aria-label="Fecha de entrega"><button type="submit">Anotar</button></form>'+p.map(function(t){return taskHTML(t,false)}).join("")+(d.length?"<h3>Hechos</h3>"+d.map(function(t){return taskHTML(t,false)}).join(""):"")}
document.addEventListener("click",function(e){var t=e.target,b;
if(b=t.closest("[data-d]")){day=+b.dataset.d;render()}
else if(b=t.closest("[data-s]")){open=b.dataset.s;$("ov").className="open";render()}
else if(t.id==="bH"){view="H";render()}else if(t.id==="bP"){view="P";render()}
else if(t.id==="cl"||t.id==="ov"){open=null;$("ov").className="";render()}
else if(b=t.closest("[data-del]")){tasks=tasks.filter(function(x){return x.id!=b.dataset.del});save();render()}});
document.addEventListener("change",function(e){var id=e.target.dataset&&e.target.dataset.id;if(!id)return;
tasks.forEach(function(x){if(String(x.id)===id)x.done=e.target.checked});save();render()});
document.addEventListener("submit",function(e){e.preventDefault();var v=$("tx").value.trim();if(!v)return;
tasks.push({id:Date.now(),s:open,x:v,due:$("du").value,done:false});save();render()});
render();
</script>
</body>
</html>
